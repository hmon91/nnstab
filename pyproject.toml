[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nnstab"
dynamic = ["version"]
description = "Exponential stability of positive feedback loops with a neural network controller"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Hamidreza Montazeri Hedesh" }]
keywords = [
    "neural networks", "verification", "stability", "region of attraction",
    "sector bounds", "Lur'e systems", "positive systems", "robust control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
    "nnsector @ git+https://github.com/hmon91/nnsector.git",
]

[project.optional-dependencies]
torch = ["torch>=1.10"]
test = ["pytest>=7"]
examples = ["matplotlib>=3.4"]

[project.urls]
Homepage = "https://github.com/hmon91/nnstab"
Issues = "https://github.com/hmon91/nnstab/issues"

[tool.setuptools.dynamic]
version = { attr = "nnstab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nnstab = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
